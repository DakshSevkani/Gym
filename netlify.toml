[build]
  publish = "dist"
  command = "npm run build"

# Proxy API calls directly to Railway backend (eliminates browser CORS issues)
[[redirects]]
  from = "/api/users/login"
  to = "https://gymmanagementsystem-production-72ab.up.railway.app/user/login"
  status = 200
  force = true

[[redirects]]
  from = "/api/user/login"
  to = "https://gymmanagementsystem-production-72ab.up.railway.app/user/login"
  status = 200
  force = true

[[redirects]]
  from = "/api/users/register"
  to = "https://gymmanagementsystem-production-72ab.up.railway.app/user/register"
  status = 200
  force = true

[[redirects]]
  from = "/api/user/register"
  to = "https://gymmanagementsystem-production-72ab.up.railway.app/user/register"
  status = 200
  force = true

[[redirects]]
  from = "/api/users"
  to = "https://gymmanagementsystem-production-72ab.up.railway.app/user"
  status = 200
  force = true

[[redirects]]
  from = "/api/user"
  to = "https://gymmanagementsystem-production-72ab.up.railway.app/user"
  status = 200
  force = true

[[redirects]]
  from = "/api/users/*"
  to = "https://gymmanagementsystem-production-72ab.up.railway.app/user/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/user/*"
  to = "https://gymmanagementsystem-production-72ab.up.railway.app/user/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/members"
  to = "https://gymmanagementsystem-production-72ab.up.railway.app/member"
  status = 200
  force = true

[[redirects]]
  from = "/api/member"
  to = "https://gymmanagementsystem-production-72ab.up.railway.app/member"
  status = 200
  force = true

[[redirects]]
  from = "/api/members/*"
  to = "https://gymmanagementsystem-production-72ab.up.railway.app/member/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/member/*"
  to = "https://gymmanagementsystem-production-72ab.up.railway.app/member/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/trainers"
  to = "https://gymmanagementsystem-production-72ab.up.railway.app/trainer"
  status = 200
  force = true

[[redirects]]
  from = "/api/trainer"
  to = "https://gymmanagementsystem-production-72ab.up.railway.app/trainer"
  status = 200
  force = true

[[redirects]]
  from = "/api/trainers/*"
  to = "https://gymmanagementsystem-production-72ab.up.railway.app/trainer/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/trainer/*"
  to = "https://gymmanagementsystem-production-72ab.up.railway.app/trainer/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/payments"
  to = "https://gymmanagementsystem-production-72ab.up.railway.app/payment"
  status = 200
  force = true

[[redirects]]
  from = "/api/payment"
  to = "https://gymmanagementsystem-production-72ab.up.railway.app/payment"
  status = 200
  force = true

[[redirects]]
  from = "/api/payments/*"
  to = "https://gymmanagementsystem-production-72ab.up.railway.app/payment/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/payment/*"
  to = "https://gymmanagementsystem-production-72ab.up.railway.app/payment/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "https://gymmanagementsystem-production-72ab.up.railway.app/:splat"
  status = 200
  force = true

# SPA client-side fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

